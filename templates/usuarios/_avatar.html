{# Foto redonda del usuario, o un círculo con su inicial si no tiene foto. #}
{# Uso: {% include "usuarios/_avatar.html" with usuario=algun_usuario tamano=48 %} #}
{% if usuario.foto %}
  <img src="{{ usuario.foto.url }}" alt="Foto de {{ usuario.get_full_name|default:'usuario UPB' }}"
       class="rounded-circle object-fit-cover flex-shrink-0" width="{{ tamano }}" height="{{ tamano }}">
{% else %}
  <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-semibold flex-shrink-0"
        style="width: {{ tamano }}px; height: {{ tamano }}px; font-size: calc({{ tamano }}px * 0.45);"
        aria-hidden="true">{{ usuario.first_name|default:usuario.email|first|upper }}</span>
{% endif %}
